# Lead scoring eval: 30 synthetic B2B contacts. Names and companies are invented, emails use
# example.com, and no case describes a real person.
#
# Labelling rubric (the same scale the scoring prompt gives the model):
#
#   hot  (70-100)  An open deal at qualified stage or later that is moving, AND a two-way
#                  contact in the last 14 days, AND a concrete buying signal (budget approved,
#                  contract or pricing discussed, start date asked for).
#   warm (40-69)   Real interest with something missing: an early deal, engagement without a
#                  deal, an advanced deal gone quiet for 15 to 45 days, a blocker (budget
#                  freeze, champion left, competitor), or no decision maker involved yet.
#   cold (0-39)    No open deal and little or old engagement; a lost deal with no new interest;
#                  outreach that never got an answer; not a buyer at all; or any deal with no
#                  two-way contact for more than 60 days (a deal that silent counts as stalled,
#                  whatever its stage or size).
#
# The temperature is the label to match. The band is the range of scores accepted for the
# case: usually the whole temperature range, narrower for clear-cut cases, and a little wider
# across a boundary for tricky ones.
#
# Each case: id, description, contact (email is never sent to the model), optional company,
# deals (stage, amount in euros, optional close_in_days) and activities (days_ago: 0 = today).

