name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests with coverage
        run: pytest --cov --cov-report=term

  image:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t leadpilot:ci .

      - name: Start and call /health
        run: |
          docker run -d --name leadpilot -p 8080:8080 -e DATABASE_URL=sqlite:////tmp/ci.db leadpilot:ci
          for _ in $(seq 1 20); do
            if curl -fsS localhost:8080/health; then exit 0; fi
            sleep 1
          done
          docker logs leadpilot
          exit 1
